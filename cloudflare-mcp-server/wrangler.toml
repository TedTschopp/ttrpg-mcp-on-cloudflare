name = "ttrpg-mcp-server"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Custom domain route
routes = [
  { pattern = "ttrpg-mcp.tedt.org/mcp", zone_name = "tedt.org" },
  { pattern = "ttrpg-mcp.tedt.org/mcp/*", zone_name = "tedt.org" }
]

[vars]
DATA_BASE_URL = "https://ttrpg-mcp.tedt.org/data"
ALLOWED_ORIGINS = "https://ttrpg-mcp.tedt.org"
BUILD_VERSION = "dev"
BUILD_COMMIT = ""
BUILD_TIME = ""

[observability]
enabled = true
head_sampling_rate = 0.1
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 0.1

[observability.traces]
enabled = false
persist = false
head_sampling_rate = 0
